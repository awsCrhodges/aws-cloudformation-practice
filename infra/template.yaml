AWSTemplateFormatVesion: "2010-09-09"
Description: "AWS practice project for CloudFormation"
Resources:

  PracticeBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudFormationLambdaRole

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.CloudFormation
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: LambdaLoggingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"


  PracticeFunction:
    Type: AWS::Lambda::PracticeFunction
    Properties:
      FunctionName: CloudFormationPracticeFunction
      Runtime: python 3.14
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn 
      Timeout: 10
      MemorySize: 128

      Code:
        ZipFile: |
          import json

          def lambda_handler(event, context):
            print("Received event: ")
            print(json.dumps(event))

            return {
              "statusCode": 200,
              "body": json.dumps({
                "message": "Lambda executed successfully."
              })
            }
Outputs:
  PracticeBucketName:
    Description: Name of the created S3 Bucket
    Value: !Ref PracticeBucket

    CloudFormationFunctionName:
      Descritpion: Name of the Lambda Function
      Value: !Ref PracticeFunction
    CloudFormationFunctionArn:
      Description: ARN of the Lambda function 
      Value: !GetAtt PracticeFunction.Arn

      
